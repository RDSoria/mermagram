name: Desktop checks

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  checks:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl wget file libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build native desktop application
        run: npm run tauri -- build --no-bundle
      - name: Launch desktop smoke check
        run: node scripts/desktop-smoke.mjs
